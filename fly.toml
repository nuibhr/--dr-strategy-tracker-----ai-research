# fly.toml app configuration file generated for dr-strategy-tracker-api-nuideeppeak on 2026-07-31T03:12:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dr-strategy-tracker-api-nuideeppeak'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
