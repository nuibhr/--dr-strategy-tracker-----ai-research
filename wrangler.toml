name = "dr-strategy-tracker-api-cf"
main = "cloudflare/worker.ts"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[containers]]
class_name = "DrStrategyTrackerContainer"
image = "./Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "DR_CONTAINER"
class_name = "DrStrategyTrackerContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DrStrategyTrackerContainer"]
