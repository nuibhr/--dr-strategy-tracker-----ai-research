name = "dr-strategy-tracker-api-cf"
main = "cloudflare/worker.ts"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Public/non-secret runtime defaults. Keep credentials in Worker Secrets.
FRONTEND_ORIGIN = "https://dr-strategy-tracker-----ai-research.pages.dev"
SETTRADE_BROKER_ID = "022"
SETTRADE_APP_CODE = "ALGO_EQ"
SETTRADE_REQUIRE_REALTIME = "true"
DR_ALLOWED_SUFFIXES = "23,80"
DR_INCLUDE_GENERATED_VARIANTS = "false"
DR_SCAN_BATCH_SIZE = "8"

[[containers]]
class_name = "DrStrategyTrackerContainer"
image = "./Dockerfile"
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "DR_CONTAINER"
class_name = "DrStrategyTrackerContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DrStrategyTrackerContainer"]
